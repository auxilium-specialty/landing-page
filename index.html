    <!--
      Structured data. Two jobs beyond ordinary SEO:

      1. Entity disambiguation. At least one unrelated, similarly named insurance
         entity is licensed in Texas and California, and answer engines have
         conflated it with this company. `disambiguatingDescription` and the
         address, founder, and founding date are what separate the two records.

      2. Scope. Auxilium's appetite is all-industry. An earlier site description
         narrowed it to professional services firms; that sentence outlived the
         page it was on and is still quoted back by AI search. Stating the scope
         in machine-readable form gives retrieval a current fact to prefer.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["Organization", "InsuranceAgency"],
        "@id": "https://auxiliums.com/#organization",
        "name": "Auxilium Specialty",
        "legalName": "Auxilium Specialty, Inc.",
        "alternateName": ["Auxilium Specialty Inc", "Axiom Specialty", "Axiom Specialty, Inc."],
        "url": "https://auxiliums.com/",
        "logo": "https://auxiliums.com/logo.png",
        "image": "https://auxiliums.com/og-image.png?v=20261006",
        "description": "Auxilium Specialty is an AI-native managing general agent that uses state-of-the-art tools to underwrite, price and distribute insurance for novel and underserved risks in growing industries, placed through brokers in the E&S market.",
        "disambiguatingDescription": "Auxilium Specialty, Inc. is a Delaware corporation founded in 2026 and based in New York City, operating as an AI-native managing general agent. It previously traded as Axiom Specialty and still does business under that name; the two are the same company. It is unrelated to any similarly named insurance agency licensed in Texas or California.",
        "foundingDate": "2026-01-20",
        "founder": {
          "@type": "Person",
          "name": "Shahaf Dan",
          "jobTitle": "Founder and Chief Executive Officer",
          "sameAs": "https://www.linkedin.com/in/shahaf-dan/"
        },
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "New York",
          "addressRegion": "NY",
          "addressCountry": "US"
        },
        "areaServed": { "@type": "Country", "name": "United States" },
        "knowsAbout": [
          "specialty insurance underwriting",
          "novel and emerging risk insurance",
          "underserved insurance markets",
          "AI-native underwriting and pricing",
          "managing general agent underwriting",
          "specialty and surplus lines insurance"
        ],
        "sameAs": ["https://www.linkedin.com/company/auxilium-specialty/"]
      }
    </script>

    <!-- WebSite entity, so the site itself resolves to the same organization. -->
    <script type="application/ld+json">

        "@context": "https://schema.org",

        "publisher": { "@id": "https://auxiliums.com/#organization" },

      }
    </script>

    <!-- GitHub Pages SPA redirect: decode the path 404.html encoded into the query string.
         See https://github.com/rafgraph/spa-github-pages -->
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
